name: cron-sync

# Manual backup trigger only — the every-10-minute schedule lives in the
# sinc-cron worker service on Railway (node-cron in scripts/cron.ts).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync cron
        run: |
          curl -sS -X POST -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync" \
            --max-time 300
